name: Keep Alive

on:
  schedule:
    - cron: '0 12 1 * *'  # El día 1 de cada mes a las 12:00 UTC
  workflow_dispatch:       # Permite ejecución manual

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update keepalive timestamp
        run: |
          echo "Last keepalive: $(date -u '+%Y-%m-%d %H:%M UTC')" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive $(date -u '+%Y-%m')"
          git push
